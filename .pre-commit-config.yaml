# Works with prek (https://prek.j178.dev) or pre-commit. Install once with `prek install`.
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.79
    hooks:
      - id: rumdl-check # lint
      - id: rumdl-fmt # format
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
