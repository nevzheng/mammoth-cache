# Works with prek (https://prek.j178.dev) or pre-commit. Install once with `prek install`.
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.79
    hooks:
      - id: rumdl-check # lint
      - id: rumdl-fmt # format
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: bazel-lint
        name: clippy and rustfmt (bazel --config=lint)
        entry: bazel build --config=ci --config=lint //...
        language: system
        types: [rust]
        pass_filenames: false
      - id: ruff-format
        name: ruff format (tests/)
        entry: uv run --project tests ruff format --check tests
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (tests/)
        entry: uv run --project tests ruff check tests
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
      - id: pyrefly
        name: pyrefly check (tests/)
        entry: uv run --project tests pyrefly check --config tests/pyproject.toml
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
      - id: buildifier
        name: buildifier
        entry: bazel run @buildifier_prebuilt//:buildifier -- -lint=warn
        language: system
        files: (^|/)(BUILD\.bazel|MODULE\.bazel|.*\.bzl)$
