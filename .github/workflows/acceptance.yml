name: acceptance

# Real Gradle, Maven, Bazel and Buck2 builds against the image, one job per client line, each a
# Bazel target in tests/BUILD.bazel. See
# docs/design/0008-supported-clients.md, 0012 and 0016. Each line resolves to its newest release at
# run time, so the nightly run picks up new patch releases.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - api/**
      - Dockerfile
      - deploy/compose/**
      - tests/**
      - MODULE.bazel
      - .bazelrc
      - .github/workflows/acceptance.yml
      - .github/workflows/image.yml
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml

  clients:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gradle-7.6, target: acceptance_gradle, args: --test_arg=--gradle=7.6 }
          - { name: gradle-8.14, target: acceptance_gradle, args: --test_arg=--gradle=8.14 }
          - { name: gradle-9, target: acceptance_gradle, args: --test_arg=--gradle=9 }
          - { name: maven-ext-1.2, target: acceptance_maven, args: --test_arg=--maven=3.9 --test_arg=--maven-extension=1.2 }
          - { name: maven-ext-latest, target: acceptance_maven, args: --test_arg=--maven=3.9 --test_arg=--maven-extension=latest }
          - { name: bazel-7, target: acceptance_bazel, args: --test_arg=--bazel=7 }
          - { name: bazel-8, target: acceptance_bazel, args: --test_arg=--bazel=8 }
          - { name: bazel-9, target: acceptance_bazel, args: --test_arg=--bazel=9 }
          # Bazel over grpc:// (REAPI, doc 0016): the newest two majors, plus Buck2.
          - { name: bazel-8-grpc, target: acceptance_bazel_grpc, args: --test_arg=--bazel=8 }
          - { name: bazel-9-grpc, target: acceptance_bazel_grpc, args: --test_arg=--bazel=9 }
          - { name: buck2, target: acceptance_buck2, args: --test_arg=--buck2=latest }
          # The newest of each client against the node serving HTTPS itself (doc 0014).
          - { name: tls, target: acceptance_tls, args: --test_arg=--gradle=9 --test_arg=--maven=3.9 --test_arg=--maven-extension=latest --test_arg=--bazel=9 }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      # Java 17 is the one JDK every tested Gradle and Maven version runs on (doc 0008).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mammoth-e2e
          key: clients-${{ matrix.name }}-${{ hashFiles('tests/acceptance/fixtures/**') }}
          restore-keys: clients-${{ matrix.name }}-
      - uses: actions/download-artifact@v8
        with:
          name: mammoth-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/mammoth-image.tar"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - Cargo.lock
            - tests/uv.lock
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test --config=ci --config=e2e //tests:${{ matrix.target }} ${{ matrix.args }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.name }}
          path: bazel-testlogs/tests/${{ matrix.target }}/test.xml
