name: acceptance

# Real Gradle, Maven, Bazel and Buck2 builds against the image, one job per client line. See
# docs/design/0008-supported-clients.md, 0012 and 0016. Each line resolves to its newest release at
# run time, so the nightly run picks up new patch releases.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - api/**
      - Dockerfile
      - deploy/compose/**
      - tests/**
      - .github/workflows/acceptance.yml
      - .github/workflows/image.yml
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml

  clients:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gradle-7.6, suite: test_gradle.py, args: --gradle 7.6 }
          - { name: gradle-8.14, suite: test_gradle.py, args: --gradle 8.14 }
          - { name: gradle-9, suite: test_gradle.py, args: --gradle 9 }
          - { name: maven-ext-1.2, suite: test_maven.py, args: --maven 3.9 --maven-extension 1.2 }
          - { name: maven-ext-latest, suite: test_maven.py, args: --maven 3.9 --maven-extension latest }
          - { name: bazel-7, suite: test_bazel.py, args: --bazel 7 }
          - { name: bazel-8, suite: test_bazel.py, args: --bazel 8 }
          - { name: bazel-9, suite: test_bazel.py, args: --bazel 9 }
          # Bazel over grpc:// (REAPI, doc 0016): the newest two majors, plus Buck2.
          - { name: bazel-8-grpc, suite: "test_bazel_grpc*.py", args: --bazel 8 }
          - { name: bazel-9-grpc, suite: "test_bazel_grpc*.py", args: --bazel 9 }
          - { name: buck2, suite: test_buck2.py, args: --buck2 latest }
    name: ${{ matrix.name }}
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      # Java 17 is the one JDK every tested Gradle and Maven version runs on (doc 0008).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mammoth-e2e
          key: clients-${{ matrix.name }}-${{ hashFiles('tests/acceptance/fixtures/**') }}
          restore-keys: clients-${{ matrix.name }}-
      - uses: actions/download-artifact@v8
        with:
          name: mammoth-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/mammoth-image.tar"
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: tests
      - run: uv sync --locked
      - run: >-
          uv run pytest acceptance/${{ matrix.suite }} ${{ matrix.args }}
          --junitxml="$RUNNER_TEMP/${{ matrix.name }}.xml"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.xml
