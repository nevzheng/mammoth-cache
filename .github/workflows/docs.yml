name: docs

# Builds the mdBook site on every PR that touches it, and deploys to GitHub Pages from main.
on:
  pull_request:
    paths:
      - docs/**
      - branding/**
      - book-theme/**
      - book.toml
      - scripts/docs.sh
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - branding/**
      - book-theme/**
      - book.toml
      - scripts/docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # page dates come from git history
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: scripts/docs.sh build
      - name: Check branding/palette.css matches palette.json
        run: git diff --exit-code -- branding/palette.css
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  docs-deploy:
    if: github.event_name != 'pull_request'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
