name: docs

# Builds the mdBook site on every PR that touches it, and deploys to GitHub Pages from main.
on:
  pull_request:
    paths:
      - docs/**
      - branding/**
      - book-theme/**
      - book.toml
      - scripts/docs.sh
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - branding/**
      - book-theme/**
      - book.toml
      - scripts/docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # page dates come from git history
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: mdbook@0.5.4
      - run: scripts/docs.sh build
      - name: Check branding/palette.css matches palette.json
        run: git diff --exit-code -- branding/palette.css
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  docs-deploy:
    if: github.event_name != 'pull_request'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
