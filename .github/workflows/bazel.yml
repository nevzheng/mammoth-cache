name: bazel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels a pull request's run, but every main commit runs to the end: a cancelled run
# saves no caches and leaves the commit without a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds and tests every target with clippy and rustfmt applied, warnings as errors.
  bazel-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          # Key the repository and disk caches on Cargo.lock as well as MODULE.bazel (the disk cache
          # adds the BUILD files), so a crate bump saves fresh caches instead of downloading and
          # compiling the new crates on every run.
          repository-cache: |
            - MODULE.bazel
            - Cargo.lock
          # Pull requests restore main's caches but don't save their own: caches saved on a pull
          # request are visible to that pull request only, and would push main's out of the
          # repository's cache quota.
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test --config=ci --config=lint //...

  # BUILD/MODULE formatting and the Rust version shared with rust-toolchain.toml.
  bazel-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: scripts/check-toolchain-sync.sh
      - run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r "$PWD"
