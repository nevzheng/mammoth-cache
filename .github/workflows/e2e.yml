name: e2e

# End-to-end suite: the image on the Compose stack (mammoth, SeaweedFS, Prometheus), driven by the
# Python harness in tests/, run as the Bazel target //tests:e2e. Ruff and pyrefly run in bazel.yml.
# See docs/design/0011-end-to-end-and-load-testing.md.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - Dockerfile
      - .dockerignore
      - deploy/compose/**
      - tests/**
      - MODULE.bazel
      - .bazelrc
      - .github/workflows/e2e.yml
      - .github/workflows/image.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml

  e2e:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mammoth-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/mammoth-image.tar"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - Cargo.lock
            - tests/uv.lock
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test --config=ci --config=e2e //tests:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: bazel-testlogs/tests/e2e/test.xml
