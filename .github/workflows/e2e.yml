name: e2e

# End-to-end suite: the image on the Compose stack (mammoth, SeaweedFS, Prometheus), driven by the
# Python harness in tests/, run as the Bazel target //tests:e2e. Ruff and pyrefly run in bazel.yml.
# See docs/design/0011-end-to-end-and-load-testing.md.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - Dockerfile
      - .dockerignore
      - deploy/compose/**
      - tests/**
      - MODULE.bazel
      - .bazelrc
      - .github/workflows/e2e.yml
      - .github/workflows/image.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run, but every main commit runs to the end: a cancelled run
# saves no caches and leaves the commit without a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/image.yml

  e2e:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mammoth-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/mammoth-image.tar"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - Cargo.lock
            - tests/uv.lock
          cache-save: ${{ github.event_name != 'pull_request' }}
      # Pull requests and main replay Hypothesis's derandomized ci profile, so a red run is a
      # regression. The nightly run explores new random examples, more of them, and prints a
      # `@reproduce_failure` blob for each failure (tests/conftest.py).
      - if: github.event_name == 'schedule'
        run: |
          {
            echo HYPOTHESIS_PROFILE=nightly
            echo MAMMOTH_E2E_EXAMPLES=200
            echo MAMMOTH_E2E_CHAOS_EXAMPLES=20
            echo MAMMOTH_E2E_RACE_EXAMPLES=50
            echo PYTEST_TIMEOUT=3600
          } >> "$GITHUB_ENV"
      - run: bazel test --config=ci --config=e2e //tests:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: bazel-testlogs/tests/e2e/test.xml
