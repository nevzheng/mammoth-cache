name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels a pull request's run; every main commit runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

# Bazel is the build of record: bazel.yml builds, lints (clippy, rustfmt) and tests every target.
# These Cargo jobs cover only what the Bazel build doesn't: the generated REAPI code, the allocators
# other than the default, the minimum supported Rust version and cargo-deny.
jobs:
  # Path filters live here, not under `on:`, because the main ruleset requires `msrv` and `deny`: a
  # job skipped by its `if` reports success, while a workflow skipped by `paths` reports nothing and
  # leaves the pull request waiting. Pushes to main run everything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      codegen: ${{ steps.filter.outputs.codegen }}
      deny: ${{ steps.filter.outputs.deny }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - Cargo.toml
              - Cargo.lock
              - crates/**
              - rust-toolchain.toml
              - rustfmt.toml
              - clippy.toml
              - .github/workflows/rust.yml
              # Files the integration tests embed with include_str! (see docs/BUILD.bazel).
              - api/openapi/**
              - docs/design/0004-metrics.md
              - docs/design/0017-errors.md
              - docs/user/configuration.md
              - docs/user/mammoth.example.toml
              - docs/user/metrics.md
            codegen:
              - third_party/proto/**
              - scripts/reapi-codegen/**
              - crates/mammoth-cache/src/reapi/proto/**
              - rust-toolchain.toml
              - .github/workflows/rust.yml
            deny:
              - "**/Cargo.toml"
              - "**/Cargo.lock"
              - deny.toml
              - .github/workflows/rust.yml

  # The REAPI code in src/reapi/proto/ is generated and checked in. Regenerate it from the vendored
  # protos and fail on any difference, so the protos, the generator and the code cannot drift.
  reapi-codegen:
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.codegen == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The generator runs rustfmt with the pinned toolchain's component.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: scripts/reapi-codegen
      - run: cargo run --locked --manifest-path scripts/reapi-codegen/Cargo.toml
      - name: Generated code matches the protos
        run: |
          git add --intent-to-add crates/mammoth-cache/src/reapi/proto
          if ! git diff --exit-code -- crates/mammoth-cache/src/reapi/proto; then
            echo "::error::src/reapi/proto/ is out of date: run" \
              "cargo run --manifest-path scripts/reapi-codegen/Cargo.toml and commit the result"
            exit 1
          fi

  # Bazel builds the default allocator, mimalloc; check the others still lint, build and pass.
  allocators:
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--no-default-features --features jemalloc"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }}
      - run: cargo nextest run --workspace --locked ${{ matrix.features }}

  msrv:
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+1.91` overrides rust-toolchain.toml.
      - run: cargo +1.91 check --workspace --locked

  deny:
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.deny == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
