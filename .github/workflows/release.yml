name: release

# Release binaries and the container image.
#
# - Tag `v*` (pushed by release-plz): attach binaries and SHA256SUMS to the GitHub release, and push
#   the image as `X.Y.Z`, `X.Y` and `latest`.
# - Push to main: push the image as `edge` and `sha-<commit>`. Binaries stay as run artifacts.
# - Pull request touching release files, or a manual run: build everything, publish nothing.
#
# Binaries are built natively on amd64, arm64 and macOS runners (no QEMU). See
# docs/design/0009-releases.md.
on:
  pull_request:
    paths:
      - Dockerfile.release
      - scripts/smoke-test.sh
      - release-plz.toml
      - rust-toolchain.toml
      - .github/workflows/release.yml
      - .github/workflows/release-plz.yml
  push:
    branches: [main]
    tags: ["v*"]
    # Not applied to tag pushes.
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - rust-toolchain.toml
      - Dockerfile.release
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The commit, as `revision` on `mammoth_build_info`.
  MAMMOTH_REVISION: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository }}
  # Publish only from pushes to this repository: main (edge) or a tag (release).
  PUBLISH: ${{ github.event_name == 'push' && github.repository == 'nevzheng/mammoth-cache' }}

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml, then the target for it.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      # musl-gcc, for crates that compile C.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --profile dist --locked --bin mammoth --target ${{ matrix.target }}
      # Every target runs on its own architecture, so each binary is started before it ships.
      - name: Smoke test
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          scripts/smoke-test.sh binary "target/${{ matrix.target }}/dist/mammoth" "$version"
      - name: Package
        shell: bash
        run: |
          name="mammoth-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/mammoth" LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # release-plz creates the release when it tags. Create one only if the tag was pushed by hand.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"
          gh release upload "$TAG" dist/* --clobber

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-linux-musl"
          path: dist
          merge-multiple: true
      # Lay out the build context as Dockerfile.release expects: linux-<arch>/mammoth.
      - name: Stage binaries
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}" target="${pair#*:}-unknown-linux-musl"
            mkdir -p "context/linux-$arch"
            tar -xzf "dist/mammoth-$target.tar.gz" -C "context/linux-$arch" --strip-components=1 \
              "mammoth-$target/mammoth"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            Dockerfile.release
            Cargo.toml
            scripts/smoke-test.sh
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Run the amd64 image before the multi-arch build pushes anything.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: src/Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: mammoth-cache:smoke
      - name: Smoke test
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -n 1)
          src/scripts/smoke-test.sh image mammoth-cache:smoke "$version"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` follows the newest non-prerelease tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: src/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
