# mammoth with an S3-compatible bucket (SeaweedFS) and Prometheus. Used by the end-to-end and
# acceptance suites (docs/design/0011-end-to-end-and-load-testing.md), and a working example for
# trying mammoth locally:
#
#   docker compose -f deploy/compose/compose.yaml up --build
#
# Nodes: `mammoth` (port 5071, REAPI gRPC on 6011) needs credentials for everything; `mammoth-open` (5073) lets
# anonymous requests read; `mammoth-proxied` sits behind nginx, on 8080 with the documented proxy
# settings and on 8081 with nginx's defaults. `mammoth-memory` (5074), `mammoth-memory-disk` (5075)
# and `mammoth-memory-bucket` (5076) run the other tier topologies; `mammoth-max-available` (5077)
# sizes its disk tier from a 64 MiB tmpfs. Profiles: `multi` adds
# `mammoth-2` (5072) on the same bucket; `observe` adds Grafana (3000). MAMMOTH_IMAGE picks the image under test, for example
# ghcr.io/nevzheng/mammoth-cache:edge. MAMMOTH_CONFIG_DIR swaps in other config files.

name: mammoth

x-mammoth: &mammoth
  image: ${MAMMOTH_IMAGE:-mammoth-cache:e2e}
  build:
    context: ../..
  environment:
    MAMMOTH_CONFIG: /etc/mammoth/mammoth.toml
    # The bucket tier reads credentials from the environment, never from mammoth.toml.
    AWS_ACCESS_KEY_ID: mammoth-e2e
    AWS_SECRET_ACCESS_KEY: mammoth-e2e-secret
    AWS_ALLOW_HTTP: "true"
  restart: "no"
  depends_on:
    init:
      condition: service_completed_successfully
  # The image is distroless, with no shell or curl for an in-container health check. The harness
  # waits on /readyz from the host instead.

services:
  mammoth:
    <<: *mammoth
    ports:
      - "${MAMMOTH_PORT:-5071}:5071"
      - "${MAMMOTH_REAPI_PORT:-6011}:6011"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/mammoth.toml:/etc/mammoth/mammoth.toml:ro
      - mammoth-disk:/var/lib/mammoth

  mammoth-open:
    <<: *mammoth
    ports:
      - "${MAMMOTH_OPEN_PORT:-5073}:5071"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/mammoth-open.toml:/etc/mammoth/mammoth.toml:ro
      - mammoth-open-disk:/var/lib/mammoth

  mammoth-proxied:
    <<: *mammoth
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/mammoth-proxied.toml:/etc/mammoth/mammoth.toml:ro
      - mammoth-proxied-disk:/var/lib/mammoth

  # Tier topologies other than the full one above: memory only, memory and disk, memory and the
  # bucket. tests/e2e/test_topologies.py runs the same checks against each.
  mammoth-memory:
    <<: *mammoth
    ports:
      - "${MAMMOTH_MEMORY_PORT:-5074}:5071"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/topology-memory.toml:/etc/mammoth/mammoth.toml:ro

  mammoth-memory-disk:
    <<: *mammoth
    ports:
      - "${MAMMOTH_MEMORY_DISK_PORT:-5075}:5071"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/topology-memory-disk.toml:/etc/mammoth/mammoth.toml:ro
      - mammoth-memory-disk-disk:/var/lib/mammoth

  # disk.size = "max-available" on a tmpfs of a known size. tests/e2e/test_disk_sizing.py.
  mammoth-max-available:
    <<: *mammoth
    ports:
      - "${MAMMOTH_MAX_AVAILABLE_PORT:-5077}:5071"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/max-available.toml:/etc/mammoth/mammoth.toml:ro
      - type: tmpfs
        target: /var/lib/mammoth
        tmpfs:
          size: 67108864 # 64 MiB
          mode: 01777

  mammoth-memory-bucket:
    <<: *mammoth
    ports:
      - "${MAMMOTH_MEMORY_BUCKET_PORT:-5076}:5071"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/topology-memory-bucket.toml:/etc/mammoth/mammoth.toml:ro

  nginx:
    image: nginx:1.31.6-alpine
    ports:
      - "${NGINX_PORT:-8080}:8080"
      - "${NGINX_DEFAULTS_PORT:-8081}:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mammoth-proxied

  mammoth-2:
    <<: *mammoth
    profiles: [multi]
    ports:
      - "${MAMMOTH_2_PORT:-5072}:5071"
    volumes:
      - ${MAMMOTH_CONFIG_DIR:-./config}/mammoth.toml:/etc/mammoth/mammoth.toml:ro
      - mammoth-2-disk:/var/lib/mammoth

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=0 -s3
      -s3.config=/etc/seaweedfs/s3.json -metricsPort=9324
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: hands the disk volumes to the image's nonroot user (65532) and creates the bucket.
  # Idempotent, so `up` works on a stack that is already running. The harness also runs it to
  # wipe a node's disk.
  init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown 65532:65532 /disks/*;
        out=$$(echo 's3.bucket.create -name mammoth-e2e' | weed shell -master=seaweedfs:9333 2>&1);
        echo "$$out"; echo "$$out" | grep -q -E 'created bucket|already exists'
    volumes:
      - mammoth-disk:/disks/mammoth
      - mammoth-open-disk:/disks/mammoth-open
      - mammoth-proxied-disk:/disks/mammoth-proxied
      - mammoth-memory-disk-disk:/disks/mammoth-memory-disk
      - mammoth-2-disk:/disks/mammoth-2
    depends_on:
      seaweedfs:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway # Locust's exporter runs on the host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  grafana:
    image: grafana/grafana:13.0.11
    profiles: [observe]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  mammoth-disk:
  mammoth-open-disk:
  mammoth-proxied-disk:
  mammoth-memory-disk-disk:
  mammoth-2-disk:
