# nginx in front of `mammoth-proxied`, twice: port 8080 with the settings the deployment guide
# (docs/user/deployment.md) asks for, port 8081 with nginx's defaults. The proxy tests send a
# 100 MiB store through each to show the default 1 MiB body limit answers 413 (doc 0013).
events {}

http {
    upstream mammoth {
        server mammoth-proxied:5071;
        keepalive 16;
    }

    # As documented: no body limit, stream uploads instead of buffering them, long timeouts.
    server {
        listen 8080;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            proxy_pass http://mammoth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # nginx's defaults: client_max_body_size 1m.
    server {
        listen 8081;

        location / {
            proxy_pass http://mammoth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
