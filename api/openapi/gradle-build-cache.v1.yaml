openapi: 3.1.0
info:
  title: mammoth-cache Gradle HTTP build cache
  version: 1.0.0
  summary: The Gradle HTTP build cache protocol, as served by mammoth-cache.
  description: |
    Gradle owns this contract; this document describes it, it does not design it. Sources:
    the Gradle user guide (https://docs.gradle.org/current/userguide/build_cache.html),
    `HttpBuildCacheService` and `BaseRemoteBuildCacheServiceHandle` in gradle/gradle, and the
    Develocity docs for the Develocity Gradle plugin and Maven extension, which use the same route.

    Rules that come from Gradle and override API style guides, including AIP-193:

    - Gradle reads only the status code. Error bodies follow AIP-193 for humans and tools.
    - These statuses **fail the build**: 305, 400, 401, 403, 405, 406, 407, 411, 415, 417, 426,
      505, 511. Never return one for a condition the build should survive.
    - Any other non-2xx status, `413`, `429` and every `5xx` included, turns the remote cache off
      for the rest of the build (Gradle 4.3 and later). The Gradle user guide says `413` on store
      only skips the entry, but the client code has no such case.
    - Gradle never retries a failed request and ignores `Retry-After`.
    - Entries are content-addressed, so they never change once stored.

    Gradle `HttpBuildCache` sends HTTP Basic preemptively. Develocity clients send an access
    token, most likely as Bearer or as the Basic password with an empty user name; both are
    accepted. Their exact requests are unverified until captured from real traffic, so they are
    not claimed as supported clients yet.

    Configure Gradle with the base URL `https://<host>/cache/`.
  contact:
    name: mammoth-cache
    url: https://github.com/nevzheng/mammoth-cache
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: https://localhost:5071
    description: Local, with TLS enabled. Without TLS the scheme is `http`.
    x-internal: false
security:
  - basicAuth: []
  - bearerAuth: []
  - {}
tags:
  - name: gradle
    description: Gradle HTTP build cache protocol
paths:
  /cache/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: |
          The cache key Gradle computed for a task: a lowercase hex hash. Treated as opaque; the
          length is not fixed by the protocol.
        schema:
          type: string
          pattern: "^[0-9a-f]+$"
          maxLength: 128
          examples: [a3f5e1c09b2d4e7f8a1b6c3d5e9f0a2b]
    get:
      operationId: loadEntry
      summary: Load a cache entry
      description: |
        A hit returns the entry exactly as it was stored. Gradle sends
        `Accept: application/vnd.gradle.build-cache-artifact.v1, */*` up to 8.7 and `.v2` from 8.8;
        the server answers with `application/octet-stream`, which that `*/*` accepts.
      tags: [gradle]
      parameters:
        - $ref: "#/components/parameters/GradleVersion"
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: Hit.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                contentMediaType: application/octet-stream
        "400":
          $ref: "#/components/responses/InvalidKey"
        "404":
          $ref: "#/components/responses/Miss"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./common.yaml#/components/responses/PermissionDenied"
        "500":
          $ref: "./common.yaml#/components/responses/Internal"
        "503":
          $ref: "./common.yaml#/components/responses/Unavailable"
    head:
      operationId: checkEntry
      summary: Check whether a cache entry exists
      description: Gradle never sends `HEAD`; other clients do. Same statuses as `GET`, no body.
      tags: [gradle]
      responses:
        "200":
          description: The entry exists.
          headers:
            Content-Length:
              description: Size of the entry in bytes.
              schema:
                type: integer
                format: int64
                minimum: 0
                maximum: 9223372036854775807
        "400":
          description: The key is not a lowercase hex string.
        "404":
          description: The entry does not exist.
        "401":
          description: Credentials are missing or wrong.
        "403":
          description: The user may not read the cache.
        "500":
          description: An unexpected server error.
        "503":
          description: The server cannot serve the request right now.
    put:
      operationId: storeEntry
      summary: Store a cache entry
      description: |
        Gradle sends `Content-Type: application/vnd.gradle.build-cache-artifact.v1` up to 8.7 and
        `.v2` from 8.8. The server accepts any content type and stores the body as opaque bytes;
        it must never answer `415`, which fails the build. Storing a key that already exists
        succeeds without rewriting it.

        The server must honour `Expect: 100-continue` (sent when `useExpectContinue` is set, and
        always through a proxy with credentials): it checks credentials, scope and
        `Content-Length` before answering `100 Continue`, so a refused upload is never sent.

        An entry over the size limit is accepted and dropped: the server answers `200`, discards
        the bytes and counts the drop in `mammoth_cache_stores_total{result="too_large"}`. A
        `413` would turn the remote cache off for the rest of the build, costing every later hit
        for the sake of one entry. With `Expect: 100-continue` the server answers `200` instead of
        `100 Continue`, so the body is never sent; without it, the server reads and discards the
        body, because closing the connection early would also count as an error.
      tags: [gradle]
      parameters:
        - $ref: "#/components/parameters/GradleVersion"
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/Expect"
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
              contentMediaType: application/octet-stream
      responses:
        "201":
          description: Stored.
        "200":
          description: |
            Nothing was written: the entry was already present, or it was over the size limit and
            was dropped.
        "400":
          $ref: "#/components/responses/InvalidKey"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "./common.yaml#/components/responses/PermissionDenied"
        "500":
          $ref: "./common.yaml#/components/responses/Internal"
        "503":
          $ref: "./common.yaml#/components/responses/Unavailable"
components:
  securitySchemes:
    basicAuth:
      $ref: "./common.yaml#/components/securitySchemes/basicAuth"
    bearerAuth:
      $ref: "./common.yaml#/components/securitySchemes/bearerAuth"
  parameters:
    GradleVersion:
      name: X-Gradle-Version
      in: header
      required: false
      description: The Gradle version, sent by Gradle 4.0 and later. Used for metrics and logs only.
      schema:
        type: string
        maxLength: 64
        pattern: "^[0-9A-Za-z.+-]+$"
        examples: ["8.10"]
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: |
        Gradle sends `Gradle/<version> (<os>;<os version>;<arch>) (<vendor>;<java>;<vm>)`. Used for
        metrics and logs only; never for authentication or behaviour, since clients choose it.
      schema:
        type: string
        maxLength: 512
        examples: ["Gradle/8.10 (Linux;6.1;amd64) (Eclipse Adoptium;17.0.9;17.0.9+9)"]
    Expect:
      name: Expect
      in: header
      required: false
      description: Lets the server refuse an upload before the body is sent.
      schema:
        type: string
        const: 100-continue
  responses:
    InvalidKey:
      description: |
        The key is not a lowercase hex string. Gradle never sends one, and would fail the build on
        `400`; this exists for other clients.
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorResponse"
          example:
            error:
              code: 400
              message: Cache key must be lowercase hex.
              status: INVALID_ARGUMENT
              details:
                - "@type": type.googleapis.com/google.rpc.ErrorInfo
                  reason: INVALID_CACHE_KEY
                  domain: mammoth-cache.dev
    Miss:
      description: Miss. Not an error for Gradle; it runs the task.
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorResponse"
          example:
            error:
              code: 404
              message: Cache entry not found.
              status: NOT_FOUND
              details:
                - "@type": type.googleapis.com/google.rpc.ErrorInfo
                  reason: ENTRY_NOT_FOUND
                  domain: mammoth-cache.dev
                  metadata:
                    key: a3f5e1c09b2d4e7f8a1b6c3d5e9f0a2b
