[package]
name = "mammoth-cache"
description = "A fast, open-source remote build cache node for Gradle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mammoth"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = "0.8"
blake3 = "1.8.7"
bytes = "1.12.1"
crc32c = "0.6.8"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
foyer-common = "=0.22.6"
foyer-memory = "=0.22.6"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
