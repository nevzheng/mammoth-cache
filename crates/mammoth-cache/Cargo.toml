[package]
name = "mammoth-cache"
description = "A fast, open-source remote build cache node for Gradle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mammoth"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["mimalloc"]
# The global allocator, fixed at build time. musl's default allocator is slow under concurrent load,
# so release builds use one of these. With both enabled, jemalloc wins.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32c = "0.6.8"
foyer-common = "=0.22.6"
foyer-memory = "=0.22.6"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "service", "http2"] }
ipnet = "2.12.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics-process = "2.4.3"
mimalloc = { version = "0.1.52", optional = true }
object_store = { version = "0.14.2", features = ["aws", "gcp", "azure", "fs"] }
prost = "0.14"
prost-types = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
time = "0.3.55"
tikv-jemallocator = { version = "0.7.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
socket2 = "0.6"
tokio-rustls = "0.26"
toml = "1.1.8"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "server", "tls-connect-info"] }
tonic-prost = "0.14.6"
tonic-types = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["catch-panic"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "system"] }

[dev-dependencies]
http-body-util = "0.1.5"
proptest = "1.12.0"
tempfile = "3.27.0"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-aws-lc"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
