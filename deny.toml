# cargo-deny: dependency licenses, advisories, duplicates and sources.
# Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail; unmaintained and yanked crates are reported too.
yanked = "deny"
ignore = [
    # `paste` is unmaintained but finished: a compile-time macro with no known vulnerability,
    # pulled in by foyer-memory (the memory tier, design doc 0010). Drop once foyer replaces it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro used by foyer-memory" },
]

[licenses]
# Permissive licenses compatible with MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's root certificates as data (webpki-root-certs, via object_store's TLS).
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow-list covers licenses we expect later; unused entries are fine.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are unpublished (publish = false), so skip their license check.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
