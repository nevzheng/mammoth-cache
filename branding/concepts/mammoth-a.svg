<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">mammoth-cache mascot, concept A: walking mammoth carrying a cache block</title>
  <!-- Far legs, a shade darker -->
  <path fill="#a33a0f" d="M64 90 H76 V112 H64 Z M100 86 H112 V112 H100 Z"/>
  <!-- Head, shoulder hump and sloping back, with a shaggy fringe underneath -->
  <path fill="#cb4b16" d="M18 42 C16 20 48 8 60 26 C78 28 104 36 114 54 C120 66 118 80 110 88
    L108 114 L94 114 L93 96 L89 100 L85 95 L80 100 L76 95 L71 100 L68 96
    L68 114 L54 114 L54 96 L50 100 L46 93 L41 97 L38 88 C32 84 26 76 24 68 Z"/>
  <!-- Fur on the hump and back -->
  <path fill="none" stroke="#a33a0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M34 22 l4 6 l4 -6 l4 6 l4 -6 M70 34 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6"/>
  <!-- Trunk, curled under the cache block -->
  <path fill="none" stroke="#cb4b16" stroke-width="10" stroke-linecap="round"
        d="M22 58 C14 74 12 92 20 102 C28 110 40 108 42 100"/>
  <!-- Cache block -->
  <rect x="24" y="80" width="18" height="18" rx="3" fill="#b58900" stroke="#073642" stroke-width="2"/>
  <path d="M24 89 H42 M33 80 V98" stroke="#073642" stroke-width="1.5"/>
  <!-- Tusk -->
  <path fill="#fdf6e3" stroke="#073642" stroke-width="2" stroke-linejoin="round"
        d="M30 62 C22 82 4 82 2 62 C8 72 18 72 24 58 Z"/>
  <!-- Ear and eye -->
  <ellipse cx="46" cy="44" rx="6" ry="8" fill="#a33a0f"/>
  <circle cx="30" cy="38" r="3" fill="#073642"/>
</svg>
