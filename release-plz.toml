# release-plz: versions, changelog, tags and GitHub releases from Conventional Commits.
# Design: docs/design/0009-releases.md. Reference: https://release-plz.dev/docs/config

[workspace]
# Versions come from `v*` git tags, not a registry. Nothing is published to crates.io.
git_only = true
publish = false
# Release only when a release PR merges, not on every push to main.
release_always = false
# The crate ships a binary; its Rust API is not a compatibility surface.
semver_check = false
git_tag_name = "v{{ version }}"
pr_name = "chore: release v{{ version }}"
# A version with a pre-release part (0.1.0-rc.1) makes a GitHub pre-release; others a full release.
git_release_type = "auto"

[[package]]
name = "mammoth-cache"
changelog_path = "CHANGELOG.md"
